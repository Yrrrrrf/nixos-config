[global]
    monitor = 0
    font = @monospace@ 10
    format = "<b>%s</b>\n%b"
    newest_on_top = true
    width = 350
    height = 100
    origin = top-right
    offset = 20x50
    frame_width = @borderWidth@
    frame_color = "@accent@70"
    separator_color = "@border@60"
    border_radius = @borderRadius_island@
    padding = 12
    horizontal_padding = 16

[urgency_low]
    background = "@bg@f0"
    foreground = "@text@"
    frame_color = "@border@70"
    timeout = 5

[urgency_normal]
    background = "@bg@f0"
    foreground = "@text@"
    frame_color = "@accent@90"
    timeout = 10

[urgency_critical]
    background = "@bg@f5"
    foreground = "@text@"
    frame_color = "@err@"
    timeout = 20
